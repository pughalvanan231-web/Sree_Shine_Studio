  <path d="M228 95 C242 95 258 106 258 120 C258 138 238 160 234 185 C230 208 240 226 244 250 C246 265 238 276 224 282 C208 288 190 280 184 266 C178 250 188 230 196 210 C204 186 214 168 214 146 C214 132 208 120 214 108 C218 100 222 95 228 95 Z" fill="url(#favBlue)" stroke="#083654" stroke-width="2" />
